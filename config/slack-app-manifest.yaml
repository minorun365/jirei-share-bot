display_information:
  name: Jirei Share Bot
  description: Slackの会話から社内事例を登録・検索・定期共有します
  background_color: "#0a4695"
features:
  bot_user:
    display_name: 事例共有くん
    always_online: false
oauth_config:
  scopes:
    bot:
      - app_mentions:read
      - chat:write
      - channels:history
settings:
  event_subscriptions:
    request_url: https://REPLACE_WITH_API_ID.execute-api.REPLACE_WITH_REGION.amazonaws.com/slack/events
    bot_events:
      - app_mention
  interactivity:
    is_enabled: false
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
