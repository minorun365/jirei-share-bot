name: Bug report
description: Report reproducible behavior that appears incorrect.
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Do not include production Slack messages, tokens, channel IDs, AWS resource IDs, customer names, or personal information.
  - type: textarea
    id: behavior
    attributes:
      label: What happened?
      description: Describe the observed behavior using synthetic data.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How can we reproduce it?
      description: Include the minimal steps and configuration with secrets removed.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
    validations:
      required: true
