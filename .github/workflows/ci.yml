name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run build
      - run: npm test
      - run: npm run check:public
      - run: npm run synth -- -c targetChannelId=C9999999999 -c bedrockModelId=example.model-id

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
      - run: uvx --from pip-audit==2.10.1 pip-audit --no-deps --disable-pip -r agentcore-runtime/requirements.txt
      - run: uv run --with-requirements agentcore-runtime/requirements-dev.txt pytest agentcore-runtime/tests/test_main_smoke.py
